  <line x1="306" y1="24" x2="306" y2="178" class="ep-grid-line" stroke="#dddddd" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="366" y1="24" x2="366" y2="178" class="ep-grid-line" stroke="#dddddd" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="426" y1="24" x2="426" y2="178" class="ep-grid-line" stroke="#dddddd" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="486" y1="24" x2="486" y2="178" class="ep-grid-line" stroke="#dddddd" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="546" y1="24" x2="546" y2="178" class="ep-grid-line" stroke="#dddddd" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="606" y1="24" x2="606" y2="178" class="ep-grid-line" stroke="#dddddd" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="666" y1="24" x2="666" y2="178" class="ep-grid-line" stroke="#dddddd" stroke-width="1" stroke-dasharray="2,4"/>

