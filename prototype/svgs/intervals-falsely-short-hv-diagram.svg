    <line x1="120" y1="22" x2="120" y2="180" class="ep-grid-line" stroke="#dddddd" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="180" y1="22" x2="180" y2="180" class="ep-grid-line" stroke="#dddddd" stroke-width="1" stroke-dasharray="2,4"/>
