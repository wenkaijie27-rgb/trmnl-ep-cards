  <g class="ep-hatch-group"><line x1="296.0" y1="63.0" x2="299.0" y2="60.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="296.0" y1="69.0" x2="305.0" y2="60.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="296.0" y1="75.0" x2="311.0" y2="60.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="296.0" y1="81.0" x2="317.0" y2="60.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="323.0" y1="60.0" x2="301.0" y2="82.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="329.0" y1="60.0" x2="307.0" y2="82.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="335.0" y1="60.0" x2="313.0" y2="82.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="341.0" y1="60.0" x2="319.0" y2="82.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="347.0" y1="60.0" x2="325.0" y2="82.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="353.0" y1="60.0" x2="331.0" y2="82.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="359.0" y1="60.0" x2="337.0" y2="82.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="360.0" y1="65.0" x2="343.0" y2="82.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="360.0" y1="71.0" x2="349.0" y2="82.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="360.0" y1="77.0" x2="355.0" y2="82.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/></g>
  <rect x="302.0" y="63.3" width="52.0" height="15.0" rx="3" fill="#ffffff"/><text x="328.0" y="75.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:11.5px;font-weight:800;text-anchor:middle;">正确 HV</text>

  <!-- False short HV span (334..360) -->
  <rect x="334" y="138" width="26" height="20" fill="#ffffff" class="ep-hl-area ep-accent-stroke" stroke="#000000" stroke-width="1.2"/>
  <g class="ep-hatch-group"><line x1="334.0" y1="140.5" x2="336.5" y2="138.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="334.0" y1="145.5" x2="341.5" y2="138.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="334.0" y1="150.5" x2="346.5" y2="138.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="334.0" y1="155.5" x2="351.5" y2="138.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="356.5" y1="138.0" x2="336.5" y2="158.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="360.0" y1="139.5" x2="341.5" y2="158.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="360.0" y1="144.5" x2="346.5" y2="158.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="360.0" y1="149.5" x2="351.5" y2="158.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="360.0" y1="154.5" x2="356.5" y2="158.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/></g>

  <!-- Surface ECG (P at 170..220, QRS at x=360) -->
  <path d="M 110 42 L 154 42 C 166 42, 174 28, 190 28 C 206 28, 214 42, 226 42 L 360 42 L 366 48 L 378 12 L 390 50 L 398 42 L 710 42"
        fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Proximal His Track (Large A at 190, Proximal His at x=296, V at 368) -->
  <path d="M 110 100 L 186 100 M 186.0 100.0 L 190.4 79.0 L 195.9 117.8 L 201.4 88.5 L 205.2 105.9 L 208.0 100.0 L 296 100 M 296.0 100.0 L 298.8 80.0 L 302.3 117.0 L 305.8 89.0 L 308.2 105.6 L 310.0 100.0 L 366 100 M 366.0 100.0 L 370.4 78.0 L 375.9 118.7 L 381.4 87.9 L 385.2 106.2 L 388.0 100.0 L 710 100"
        fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.1" stroke-linejoin="round"/>

  <!-- Distal / Right Bundle Track (Tiny A at 194, Later RB spike at x=334, V at 362) -->
  <path d="M 110 162 L 194 162 L 198 156 L 202 167 L 206 162 L 334 162 M 334.0 162.0 L 336.4 144.0 L 339.4 177.3 L 342.4 152.1 L 344.5 167.0 L 346.0 162.0 L 362 162 M 362.0 162.0 L 366.4 140.0 L 371.9 180.7 L 377.4 149.9 L 381.2 168.2 L 384.0 162.0 L 710 162"
        fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.1" stroke-linejoin="round"/>

  <rect x="139.0" y="112.3" width="116.0" height="15.0" rx="3" fill="#ffffff"/><text x="197.0" y="124.0" fill="#444444" class="ep-svg-label ep-muted-fill" style="font-size:11.5px;font-weight:700;text-anchor:middle;">局部房波 (辅助定位)</text>
  <rect x="235.0" y="48.3" width="56.0" height="15.0" rx="3" fill="#ffffff"/><text x="288.0" y="60.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:12px;font-weight:800;text-anchor:end;">近端 His</text>
  <rect x="363.0" y="4.3" width="166.0" height="15.0" rx="3" fill="#ffffff"/><text x="366.0" y="16.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:12px;font-weight:800;text-anchor:start;">最早室激动 (两尺共同终点)</text>
  <rect x="171.0" y="174.3" width="158.0" height="15.0" rx="3" fill="#ffffff"/><text x="326.0" y="186.0" fill="#000000" class="ep-svg-label ep-accent-fill" style="font-size:11.5px;font-weight:800;text-anchor:end;">误用右束支尖波 → 假短 HV</text>
  <line x1="556.0" y1="192.0" x2="668.0" y2="192.0" class="ep-ink-stroke" stroke="#000000" stroke-width="2"/><line x1="556.0" y1="187.5" x2="556.0" y2="196.5" class="ep-ink-stroke" stroke="#000000" stroke-width="2"/><line x1="668.0" y1="187.5" x2="668.0" y2="196.5" class="ep-ink-stroke" stroke="#000000" stroke-width="2"/><text x="675.0" y="196.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:12px;font-weight:700;text-anchor:start;">100 ms</text><text x="548.0" y="196.0" fill="#4d4d4d" class="ep-svg-label ep-muted-fill" style="font-size:11.5px;font-weight:600;text-anchor:end;">确认近端尖波</text>
</svg>