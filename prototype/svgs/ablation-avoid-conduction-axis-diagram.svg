<svg class="ep-svg ep-svg--square" viewBox="0 0 360 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Koch三角安全慢径靶区与房室阻滞高危区分布图">
  <rect x="0" y="0" width="360" height="350" fill="#ffffff"/>

