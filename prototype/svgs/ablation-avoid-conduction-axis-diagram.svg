  <rect x="58.0" y="316.0" width="52.0" height="18.0" rx="3" fill="#ffffff"/><text x="84.0" y="330.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:13.5px;font-weight:700;text-anchor:middle;">CS 口</text>

