  <polygon points="379.0,141.0 372.5,144.2 372.5,137.8" class="ep-ink-fill" fill="#000000"/>
  <rect x="265.0" y="132.7" width="82.0" height="17.0" rx="3" fill="#ffffff"/><text x="306.0" y="146.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:12.5px;font-weight:800;text-anchor:middle;">RS > 100 ms</text>

  <rect x="173.0" y="4.5" width="54.0" height="16.0" rx="3" fill="#ffffff"/><text x="224.0" y="17.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:13px;font-weight:700;text-anchor:end;">R 起点</text>
