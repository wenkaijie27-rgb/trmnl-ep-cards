<svg class="ep-svg ep-svg--banner" viewBox="0 0 740 205" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="旁路提前除极与希浦下传融合形成delta波示意图">
  <rect x="0" y="0" width="740" height="205" fill="#ffffff"/>

  <!-- Left Half: Dual-Pathway Anatomical Ladder (Atrium -> AP vs AVN-His -> Ventricle Fusion) -->
  <rect x="8" y="8" width="356" height="189" rx="7" fill="#ffffff" class="ep-ink-stroke" stroke="#000000" stroke-width="1.5"/>
  <text x="20" y="28" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:13.5px;font-weight:800;">双径路激动时序：旁路先到 + 希浦合流</text>

  <!-- Chambers -->
  <rect x="34" y="40" width="304" height="26" rx="8" fill="#ffffff" class="ep-muted-stroke" stroke="#555555" stroke-width="1.3"/>
  <text x="48" y="57" fill="#555555" class="ep-svg-label ep-muted-fill" style="font-size:12px;font-weight:700;">心房</text>

  <!-- Annulus -->
  <line x1="30" y1="78" x2="108" y2="78" class="ep-ink-stroke" stroke="#000000" stroke-width="2.2"/>
  <line x1="146" y1="78" x2="246" y2="78" class="ep-ink-stroke" stroke="#000000" stroke-width="2.2"/>
  <line x1="282" y1="78" x2="342" y2="78" class="ep-ink-stroke" stroke="#000000" stroke-width="2.2"/>

  <!-- Ventricle Box -->
  <rect x="34" y="90" width="304" height="92" rx="10" fill="#ffffff" class="ep-muted-stroke" stroke="#555555" stroke-width="1.3"/>

  <!-- Normal Axis (AVN delay -> fast His-Purkinje) -->
  <ellipse cx="127" cy="78" rx="14" ry="8" fill="#ffffff" class="ep-ink-stroke" stroke="#000000" stroke-width="2"/>
  <line x1="127" y1="54" x2="127" y2="142" class="ep-ink-stroke" stroke="#000000" stroke-width="2.8"/>
  <polygon points="127.0,148.0 122.8,139.0 131.2,139.0" class="ep-ink-fill" fill="#000000"/>
  <path d="M 127 148 L 178 164" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.4"/>
  <polygon points="184.0,165.0 175.3,166.4 177.4,159.1" class="ep-ink-fill" fill="#000000"/>
  <rect x="38.0" y="115.5" width="76.0" height="16.0" rx="3" fill="#ffffff"/><text x="76.0" y="128.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:11.5px;font-weight:700;text-anchor:middle;">房室结—希浦</text>

  <!-- Accessory Pathway (No AVN delay -> early local myocardial creep) -->
  <line x1="264" y1="54" x2="264" y2="118" class="ep-accent-stroke" stroke="#000000" stroke-width="3.0" stroke-dasharray="6,3.5"/>
  <polygon points="264.0,124.0 259.8,115.0 268.2,115.0" class="ep-accent-fill" fill="#000000"/>
  <!-- Early slow spread into local myocardium -->
  <ellipse cx="238" cy="146" rx="44" ry="20" fill="#ffffff" class="ep-hl-area ep-accent-stroke" stroke="#000000" stroke-width="1.4" stroke-dasharray="3,2"/>
  <g class="ep-hatch-group"><line x1="196.7" y1="145.6" x2="210.1" y2="132.1" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="197.8" y1="150.5" x2="219.1" y2="129.3" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="200.5" y1="153.9" x2="226.5" y2="127.9" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="203.9" y1="156.6" x2="233.2" y2="127.3" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="207.8" y1="158.9" x2="239.5" y2="127.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="212.1" y1="160.7" x2="245.3" y2="127.5" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="216.8" y1="162.1" x2="250.8" y2="128.1" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="221.7" y1="163.3" x2="255.9" y2="129.1" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="227.0" y1="164.1" x2="260.8" y2="130.3" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="232.6" y1="164.6" x2="265.3" y2="131.9" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="238.5" y1="164.8" x2="269.5" y2="133.8" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="244.9" y1="164.5" x2="273.3" y2="136.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="251.8" y1="163.7" x2="276.5" y2="139.1" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/><line x1="259.6" y1="162.0" x2="278.8" y2="142.9" class="ep-hatch-line" stroke="#000000" stroke-width="1.2"/></g>
  <path d="M 254 132 L 204 160" fill="none" class="ep-accent-stroke" stroke="#000000" stroke-width="2.2" stroke-dasharray="5,3"/>
  <polygon points="198.0,163.0 203.0,155.7 206.8,162.3" class="ep-accent-fill" fill="#000000"/>
  <rect x="278.0" y="95.5" width="36.0" height="16.0" rx="3" fill="#ffffff"/><text x="296.0" y="108.0" fill="#000000" class="ep-svg-label ep-accent-fill" style="font-size:12px;font-weight:700;text-anchor:middle;">旁路</text>
  <rect x="204.0" y="161.5" width="84.0" height="16.0" rx="3" fill="#ffffff"/><text x="246.0" y="174.0" fill="#000000" class="ep-svg-label ep-accent-fill" style="font-size:11.5px;font-weight:700;text-anchor:middle;">局部室肌预激</text>
  <rect x="173.0" y="121.5" width="38.0" height="16.0" rx="3" fill="#ffffff" class="ep-muted-stroke" stroke="#555555" stroke-width="1.2"/><text x="192.0" y="134.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:12px;font-weight:800;text-anchor:middle;">融合</text>

  <!-- Right Half: Resulting Surface ECG Fusion Beat -->
  <rect x="376" y="8" width="356" height="189" rx="7" fill="#ffffff" class="ep-ink-stroke" stroke="#000000" stroke-width="1.5"/>
  <text x="388" y="28" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:13.5px;font-weight:800;">体表投影：PR 缩短 + 粗钝 delta 波</text>

  <!-- Normal reference beat (dashed muted) -->
  <path d="M 396 154 L 444 154 C 454 154, 462 136, 476 136 C 490 136, 498 154, 508 154 L 552 154 L 558 162 L 568 74 L 578 164 L 584 154 L 714 154"
        fill="none" class="ep-muted-stroke" stroke="#555555" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Delta wave highlight box on right panel: x=508..564 -->
  <rect x="508" y="114" width="56" height="48" rx="4" fill="#ffffff" class="ep-hl-area ep-ink-stroke" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,2"/>
  <g class="ep-hatch-group"><line x1="508.0" y1="117.2" x2="511.2" y2="114.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="508.0" y1="123.8" x2="517.8" y2="114.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="508.0" y1="130.2" x2="524.2" y2="114.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="508.0" y1="136.8" x2="530.8" y2="114.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="508.0" y1="143.2" x2="537.2" y2="114.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="508.0" y1="149.8" x2="543.8" y2="114.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="508.0" y1="156.2" x2="550.2" y2="114.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="556.8" y1="114.0" x2="508.8" y2="162.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="563.2" y1="114.0" x2="515.2" y2="162.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="564.0" y1="119.8" x2="521.8" y2="162.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="564.0" y1="126.2" x2="528.2" y2="162.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="564.0" y1="132.8" x2="534.8" y2="162.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="564.0" y1="139.2" x2="541.2" y2="162.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="564.0" y1="145.8" x2="547.8" y2="162.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="564.0" y1="152.2" x2="554.2" y2="162.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/><line x1="564.0" y1="158.8" x2="560.8" y2="162.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.1"/></g>

  <!-- Pre-excited ECG (short PR -> slurred delta upstroke from x=508 to x=558 -> rapid His-Purkinje peak) -->
  <path d="M 396 154 L 444 154 C 454 154, 462 136, 476 136 C 490 136, 498 154, 508 154"
        fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 508 154 L 558 122" fill="none" class="ep-accent-stroke" stroke="#000000" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M 558 122 L 568 74 L 582 162 L 592 154 L 630 154 C 648 154, 662 168, 680 168 C 698 168, 708 154, 718 154"
        fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>

  <rect x="459.0" y="114.3" width="34.0" height="15.0" rx="3" fill="#ffffff"/><text x="476.0" y="126.0" fill="#444444" class="ep-svg-label ep-muted-fill" style="font-size:11.5px;font-weight:700;text-anchor:middle;">P 波</text>
  <rect x="469.0" y="84.7" width="114.0" height="17.0" rx="3" fill="#ffffff"/><text x="526.0" y="98.0" fill="#000000" class="ep-svg-label ep-accent-fill" style="font-size:12px;font-weight:800;text-anchor:middle;">delta 波 (旁路早激)</text>
  <rect x="575.0" y="75.5" width="118.0" height="16.0" rx="3" fill="#ffffff"/><text x="634.0" y="88.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:11.5px;font-weight:700;text-anchor:middle;">希浦合流后快速主波</text>
  <line x1="564.0" y1="184.0" x2="672.0" y2="184.0" class="ep-ink-stroke" stroke="#000000" stroke-width="2"/><line x1="564.0" y1="179.5" x2="564.0" y2="188.5" class="ep-ink-stroke" stroke="#000000" stroke-width="2"/><line x1="672.0" y1="179.5" x2="672.0" y2="188.5" class="ep-ink-stroke" stroke="#000000" stroke-width="2"/><text x="679.0" y="188.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:12px;font-weight:700;text-anchor:start;">100 ms</text><text x="556.0" y="188.0" fill="#4d4d4d" class="ep-svg-label ep-muted-fill" style="font-size:11.5px;font-weight:600;text-anchor:end;">短 PR + 起始粗钝</text>
</svg>