<svg class="ep-svg ep-svg--square" viewBox="0 0 360 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="左室下间隔隐窝、心腔外锥形间隙与房室传导轴关系图">
  <rect x="0" y="0" width="360" height="350" fill="#ffffff"/>

  <!-- Left Ventricular Wall & Cavity (left side) -->
  <path d="M 38 46 C 48 134, 68 206, 94 268" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Muscular Interventricular Septum (separating LV recess on left from Pyramidal Space on right) -->
  <path d="M 136 286 C 148 242, 166 190, 184 134" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 190 296 C 194 238, 198 184, 206 130" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Membranous septum + fibrous body at apex -->
  <path d="M 184 134 C 192 98, 202 72, 214 54" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.2"/>
  <path d="M 206 130 C 216 96, 226 70, 240 52" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.2"/>
  <ellipse cx="198" cy="112" rx="14" ry="20" transform="rotate(14 198 112)" fill="#ffffff" class="ep-ink-stroke" stroke="#000000" stroke-width="1.6" stroke-dasharray="3,2"/>

  <!-- Mitral Valve Septal/Anterior Leaflet bordering the LV Inferoseptal Recess -->
  <path d="M 122 52 C 122 98, 126 154, 134 198" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="3.0" stroke-linecap="round"/>
  <path d="M 134 198 C 118 228, 114 258, 118 282" fill="none" class="ep-muted-stroke" stroke="#555555" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Highlighted LV Inferoseptal Recess (intracavitary cleft between mitral leaflet & muscular IVS) -->
  <ellipse cx="150" cy="146" rx="22" ry="34" transform="rotate(14 150 146)" fill="#ffffff" class="ep-hl-area ep-ink-stroke" stroke="#000000" stroke-width="1.4" stroke-dasharray="4,2.5"/>
  <g class="ep-hatch-group"><line x1="137.0" y1="125.4" x2="155.0" y2="114.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="132.6" y1="133.1" x2="160.8" y2="116.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="130.3" y1="139.5" x2="164.5" y2="119.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="129.1" y1="145.3" x2="167.2" y2="122.4" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="128.5" y1="150.7" x2="169.2" y2="126.3" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="128.6" y1="155.7" x2="170.5" y2="130.5" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="129.3" y1="160.3" x2="171.3" y2="135.1" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="130.4" y1="164.7" x2="171.5" y2="140.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="132.2" y1="168.6" x2="171.1" y2="145.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="134.7" y1="172.2" x2="170.1" y2="150.9" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="138.1" y1="175.2" x2="168.1" y2="157.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="143.1" y1="177.2" x2="164.5" y2="164.4" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/></g>

  <!-- Extracavitary Inferior Pyramidal Space (right of IVS, below Right Atrium, outlined with dashed border per Cabrera Fig. 3A) -->
  <path d="M 206 136 L 194 294 L 284 294 C 266 238, 240 176, 206 136 Z" fill="#ffffff" class="ep-muted-stroke" stroke="#555555" stroke-width="1.8" stroke-dasharray="5,3"/>

  <!-- Right Atrial Endocardial Contour (right side) -->
  <path d="M 248 56 C 284 82, 314 134, 318 202 C 320 248, 306 286, 286 306" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Tricuspid septal hinge separating RA from RV/septum -->
  <path d="M 224 128 C 254 148, 276 178, 288 214" fill="none" class="ep-muted-stroke" stroke="#555555" stroke-width="1.6"/>

  <!-- Conduction Axis (Compact node -> Penetrating bundle -> Non-branching -> Branching AV bundle) -->
  <path d="M 252 240 C 232 204, 214 162, 198 112 C 192 88, 186 68, 178 46" fill="none" class="ep-accent-stroke" stroke="#000000" stroke-width="3.6" stroke-dasharray="8,4" stroke-linecap="round"/>
  <polygon points="177.0,42.0 183.3,49.7 175.1,51.7" class="ep-accent-fill" fill="#000000"/>
  <ellipse cx="246" cy="228" rx="9" ry="14" transform="rotate(-24 246 228)" fill="#ffffff" class="ep-accent-stroke" stroke="#000000" stroke-width="2.2"/>

  <!-- Labels -->
  <rect x="17.0" y="12.4" width="82.0" height="20.0" rx="3" fill="#ffffff" class="ep-muted-stroke" stroke="#555555" stroke-width="1.2"/><text x="58.0" y="28.0" fill="#444444" class="ep-svg-label ep-muted-fill" style="font-size:12px;font-weight:700;text-anchor:middle;">斜切断面观</text>
  <rect x="37.0" y="100.7" width="62.0" height="17.0" rx="3" fill="#ffffff"/><text x="68.0" y="114.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:12.5px;font-weight:700;text-anchor:middle;">二尖瓣叶</text>
  <line x1="94" y1="114" x2="124" y2="114" class="ep-ink-stroke" stroke="#000000" stroke-width="1.2"/>

  <rect x="42.0" y="163.2" width="68.0" height="19.0" rx="3" fill="#ffffff" class="ep-hl-area ep-ink-stroke" stroke="#000000" stroke-width="1.2"/><g class="ep-hatch-group"><line x1="110.0" y1="166.2" x2="107.0" y2="163.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="110.0" y1="172.2" x2="101.0" y2="163.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="110.0" y1="178.2" x2="95.0" y2="163.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="89.0" y1="163.2" x2="108.0" y2="182.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="83.0" y1="163.2" x2="102.0" y2="182.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="77.0" y1="163.2" x2="96.0" y2="182.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="71.0" y1="163.2" x2="90.0" y2="182.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="65.0" y1="163.2" x2="84.0" y2="182.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="59.0" y1="163.2" x2="78.0" y2="182.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="53.0" y1="163.2" x2="72.0" y2="182.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="47.0" y1="163.2" x2="66.0" y2="182.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="42.0" y1="164.2" x2="60.0" y2="182.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="42.0" y1="170.2" x2="54.0" y2="182.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="42.0" y1="176.2" x2="48.0" y2="182.2" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/></g><rect x="46.0" y="165.2" width="60.0" height="15.0" rx="2" fill="#ffffff" class="ep-hl-label-bg"/><text x="76.0" y="178.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:12.5px;font-weight:700;text-anchor:middle;">左室隐窝</text>
  <line x1="108" y1="172" x2="142" y2="152" class="ep-ink-stroke" stroke="#000000" stroke-width="1.2"/>

  <rect x="128.0" y="34.7" width="64.0" height="17.0" rx="3" fill="#ffffff"/><text x="160.0" y="48.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:12px;font-weight:700;text-anchor:middle;">膜部间隔</text>
  <line x1="184" y1="54" x2="196" y2="96" class="ep-ink-stroke" stroke="#000000" stroke-width="1.2"/>

  <rect x="265.0" y="88.0" width="42.0" height="18.0" rx="3" fill="#ffffff"/><text x="286.0" y="102.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:13px;font-weight:700;text-anchor:middle;">右房</text>
  <rect x="258.0" y="152.0" width="56.0" height="18.0" rx="3" fill="#ffffff"/><text x="286.0" y="166.0" fill="#000000" class="ep-svg-label ep-accent-fill" style="font-size:12.5px;font-weight:800;text-anchor:middle;">传导轴</text>
  <line x1="258" y1="164" x2="218" y2="154" class="ep-accent-stroke" stroke="#000000" stroke-width="1.3"/>

  <rect x="183.0" y="304.0" width="110.0" height="18.0" rx="3" fill="#ffffff" class="ep-muted-stroke" stroke="#555555" stroke-width="1.2"/><text x="238.0" y="318.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:12px;font-weight:700;text-anchor:middle;">锥形间隙 (腔外)</text>
  <line x1="238" y1="308" x2="238" y2="278" class="ep-ink-stroke" stroke="#000000" stroke-width="1.2"/>
  <rect x="37.0" y="304.0" width="94.0" height="18.0" rx="3" fill="#ffffff"/><text x="84.0" y="318.0" fill="#444444" class="ep-svg-label ep-muted-fill" style="font-size:12px;font-weight:700;text-anchor:middle;">左室腔 (腔内)</text>
</svg>