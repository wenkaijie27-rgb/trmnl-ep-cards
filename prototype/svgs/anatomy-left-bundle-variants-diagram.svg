  <rect x="208.0" y="72.0" width="80.0" height="18.0" rx="3" fill="#ffffff"/><text x="248.0" y="86.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:12.5px;font-weight:700;text-anchor:middle;">左束支主干</text>
