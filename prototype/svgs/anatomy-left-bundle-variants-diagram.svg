  <path d="M 134 176 C 118 196, 108 214, 102 232" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="1.8"/>
  <polygon points="97.0,252.0 96.3,242.7 103.5,245.3" class="ep-ink-fill" fill="#000000"/>

