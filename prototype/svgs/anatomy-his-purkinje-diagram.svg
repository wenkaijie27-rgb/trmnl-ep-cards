<svg class="ep-svg ep-svg--portrait" viewBox="0 0 320 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="希浦系统冠状切面传导轴示意图">
  <rect x="0" y="0" width="320" height="380" fill="#ffffff"/>

  <!-- Subtle 4-chamber heart silhouette (coronal septum perspective) -->
  <path d="M 52 142 C 26 92, 60 28, 126 32 C 148 34, 158 54, 160 72 C 166 44, 194 26, 238 36 C 282 46, 294 102, 266 144"
        fill="none" class="ep-muted-stroke" stroke="#555555" stroke-width="1.5"/>
  <path d="M 52 142 C 30 198, 52 308, 154 352 C 186 364, 232 346, 266 290 C 292 246, 292 186, 266 144"
        fill="none" class="ep-muted-stroke" stroke="#555555" stroke-width="1.8"/>

  <!-- Fibrofatty AV insulation plane (left & right AV grooves) -->
  <path d="M 50 142 C 88 136, 118 136, 134 140" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 188 136 C 216 132, 242 136, 268 144" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Ventricular septum outline (muscular septum between RV & LV) -->
  <path d="M 142 152 C 138 202, 138 262, 152 316" fill="none" class="ep-muted-stroke" stroke="#555555" stroke-width="1.3" stroke-dasharray="3,3"/>
  <path d="M 182 148 C 186 202, 190 264, 174 318" fill="none" class="ep-muted-stroke" stroke="#555555" stroke-width="1.3" stroke-dasharray="3,3"/>

  <!-- Central fibrous body (highlight zone around penetrating His) -->
  <ellipse cx="160" cy="128" rx="34" ry="17" transform="rotate(-8 160 128)"
           fill="#ffffff" class="ep-hl-area ep-ink-stroke" stroke="#000000" stroke-width="1.4" stroke-dasharray="4,2.5"/>
  <g class="ep-hatch-group"><line x1="128.3" y1="132.1" x2="138.6" y2="118.3" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="130.0" y1="136.4" x2="146.2" y2="115.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="132.9" y1="139.2" x2="152.5" y2="113.1" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="136.4" y1="141.2" x2="158.3" y2="112.1" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="140.3" y1="142.7" x2="163.7" y2="111.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="144.5" y1="143.7" x2="168.7" y2="111.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="149.1" y1="144.3" x2="173.4" y2="112.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="153.9" y1="144.4" x2="177.8" y2="112.8" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="159.1" y1="144.2" x2="181.8" y2="114.0" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="164.7" y1="143.4" x2="185.5" y2="115.8" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="170.7" y1="142.0" x2="188.7" y2="118.1" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/><line x1="177.6" y1="139.6" x2="191.1" y2="121.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.3"/></g>

  <!-- AV Node (right atrial side above fibrous body) -->
  <ellipse cx="130" cy="108" rx="16" ry="10" fill="#ffffff" class="ep-ink-stroke" stroke="#000000" stroke-width="2.4"/>

  <!-- Penetrating His bundle piercing central fibrous body -->
  <path d="M 144 114 C 154 120, 162 132, 162 156" fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Right Bundle Branch (thin cord along right side of septum -> RV apex) -->
  <path d="M 161 156 C 148 186, 138 238, 136 286 C 134 308, 118 318, 96 306"
        fill="none" class="ep-accent-stroke" stroke="#000000" stroke-width="2.8" stroke-dasharray="7,3.5" stroke-linecap="round"/>
  <polygon points="136.0,268.0 132.5,259.9 140.1,260.1" class="ep-accent-fill" fill="#000000"/>

  <!-- Left Bundle Branch (broad fanning fascicles on left side of septum -> LV wall) -->
  <path d="M 163 156 C 178 176, 188 216, 190 274 C 192 310, 218 320, 242 290"
        fill="none" class="ep-accent-stroke" stroke="#000000" stroke-width="3.2" stroke-dasharray="7,3.5" stroke-linecap="round"/>
  <path d="M 168 168 C 192 184, 212 222, 220 264"
        fill="none" class="ep-accent-stroke" stroke="#000000" stroke-width="2.2" stroke-dasharray="5,3" stroke-linecap="round"/>
  <polygon points="190.0,260.0 185.9,252.1 193.5,251.9" class="ep-accent-fill" fill="#000000"/>

  <!-- Distal Subendocardial Purkinje Network (arborizing upward along outer walls) -->
  <path d="M 96 306 C 68 282, 56 236, 62 182 M 74 276 L 56 254 M 62 228 L 48 206"
        fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M 242 290 C 264 260, 272 214, 258 170 M 258 262 L 274 238 M 266 222 L 276 196"
        fill="none" class="ep-ink-stroke" stroke="#000000" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Labels (6 schema labels, clear non-overlapping layout) -->
  <rect x="23.0" y="6.4" width="78.0" height="20.0" rx="3" fill="#ffffff" class="ep-muted-stroke" stroke="#555555" stroke-width="1.2"/><text x="26.0" y="22.0" fill="#444444" class="ep-svg-label ep-muted-fill" style="font-size:12px;font-weight:700;text-anchor:start;">心室传导轴</text>

  <line x1="116" y1="102" x2="88" y2="78" class="ep-ink-stroke" stroke="#000000" stroke-width="1.3"/>
  <rect x="56.0" y="58.0" width="56.0" height="18.0" rx="3" fill="#ffffff"/><text x="84.0" y="72.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:13.5px;font-weight:700;text-anchor:middle;">房室结</text>

  <line x1="188" y1="118" x2="226" y2="86" class="ep-ink-stroke" stroke="#000000" stroke-width="1.3"/>
  <rect x="213.0" y="61.6" width="66.0" height="21.0" rx="3" fill="#ffffff" class="ep-hl-area ep-ink-stroke" stroke="#000000" stroke-width="1.2"/><g class="ep-hatch-group"><line x1="279.0" y1="64.6" x2="276.0" y2="61.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="279.0" y1="70.6" x2="270.0" y2="61.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="279.0" y1="76.6" x2="264.0" y2="61.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="279.0" y1="82.6" x2="258.0" y2="61.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="252.0" y1="61.6" x2="273.0" y2="82.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="246.0" y1="61.6" x2="267.0" y2="82.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="240.0" y1="61.6" x2="261.0" y2="82.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="234.0" y1="61.6" x2="255.0" y2="82.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="228.0" y1="61.6" x2="249.0" y2="82.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="222.0" y1="61.6" x2="243.0" y2="82.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="216.0" y1="61.6" x2="237.0" y2="82.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="213.0" y1="64.6" x2="231.0" y2="82.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="213.0" y1="70.6" x2="225.0" y2="82.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/><line x1="213.0" y1="76.6" x2="219.0" y2="82.6" class="ep-hatch-line" stroke="#000000" stroke-width="1.0"/></g><rect x="217.0" y="63.6" width="58.0" height="17.0" rx="2" fill="#ffffff" class="ep-hl-label-bg"/><text x="246.0" y="78.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:13px;font-weight:700;text-anchor:middle;">纤维体</text>

  <line x1="170" y1="150" x2="224" y2="152" class="ep-ink-stroke" stroke="#000000" stroke-width="1.3"/>
  <rect x="214.0" y="143.0" width="68.0" height="18.0" rx="3" fill="#ffffff"/><text x="248.0" y="157.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:13.5px;font-weight:700;text-anchor:middle;">His 主干</text>

  <line x1="138" y1="224" x2="96" y2="212" class="ep-accent-stroke" stroke="#000000" stroke-width="1.3"/>
  <rect x="56.0" y="192.0" width="56.0" height="18.0" rx="3" fill="#ffffff"/><text x="84.0" y="206.0" fill="#000000" class="ep-svg-label ep-accent-fill" style="font-size:13.5px;font-weight:700;text-anchor:middle;">右束支</text>

  <line x1="198" y1="224" x2="232" y2="208" class="ep-accent-stroke" stroke="#000000" stroke-width="1.3"/>
  <rect x="220.0" y="188.0" width="56.0" height="18.0" rx="3" fill="#ffffff"/><text x="248.0" y="202.0" fill="#000000" class="ep-svg-label ep-accent-fill" style="font-size:13.5px;font-weight:700;text-anchor:middle;">左束支</text>

  <line x1="104" y1="312" x2="132" y2="342" class="ep-ink-stroke" stroke="#000000" stroke-width="1.3"/>
  <line x1="228" y1="306" x2="188" y2="342" class="ep-ink-stroke" stroke="#000000" stroke-width="1.3"/>
  <rect x="92.0" y="343.2" width="136.0" height="19.0" rx="3" fill="#ffffff"/><text x="160.0" y="358.0" fill="#000000" class="ep-svg-label ep-ink-fill" style="font-size:13px;font-weight:700;text-anchor:middle;">心室内膜下浦肯野网</text>
</svg>