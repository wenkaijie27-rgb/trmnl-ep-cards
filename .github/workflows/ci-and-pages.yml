name: CI & GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Rotate current.json every 2 hours on GitHub Pages
    - cron: "0 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate card decks (Schema, budgets, abbreviations, layout)
        run: |
          python3 tools/validate_cards.py decks/golden-3.json
          python3 tools/validate_cards.py decks/batch-01-draft.json

      - name: Build distribution artifacts (JSON API, Terminus ZIP, TRMNL Recipe)
        run: python3 tools/build_dist.py

      - name: Verify Terminus sanitizer compliance
        run: python3 tools/check_terminus_sanitize.py

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: validate-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
